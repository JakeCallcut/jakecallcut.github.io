<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efefed" />
    <title>Page not found</title>
    <script>
      // Match the site's theme before first paint.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a1430' : '#efefed');
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --paper: #efefed;
        --ink: #0f1d47;
        --muted: #5d6480;
        --line: rgb(15 29 71 / 0.85);
      }

      /* Dark follows the saved theme, or the system setting when none is saved (or without JS) */
      :root.dark {
        color-scheme: dark;
        --paper: #0a1430;
        --ink: #eceef3;
        --muted: #8e96b1;
        --line: rgb(236 238 243 / 0.85);
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          color-scheme: dark;
          --paper: #0a1430;
          --ink: #eceef3;
          --muted: #8e96b1;
          --line: rgb(236 238 243 / 0.85);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .wrap {
        max-width: 1440px;
        margin: 0 auto;
        padding: 96px 16px 48px;
      }

      .rule {
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }

      .label {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .numeral {
        margin: 24px 0 0;
        font-family: "Times New Roman", Georgia, serif;
        font-size: clamp(7rem, 26vw, 22rem);
        line-height: 0.75;
        letter-spacing: -0.04em;
      }

      h1 {
        margin: 32px 0 0;
        font-family: "Times New Roman", Georgia, serif;
        font-size: 2.5rem;
        font-weight: 400;
        line-height: 1.1;
      }

      p.lede {
        margin: 16px 0 0;
        font-size: 17px;
        line-height: 1.6;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 32px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        height: 40px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 14px;
        text-decoration: none;
      }

      .button.solid {
        background: var(--ink);
        color: var(--paper);
      }

      @media (min-width: 1024px) {
        .wrap {
          padding: 112px 40px 48px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="rule" aria-labelledby="page-title">
        <p class="label">(404) Page not found</p>
        <p class="numeral" aria-hidden="true">404</p>
        <h1 id="page-title">There was a problem.</h1>
        <p class="lede">The page you asked for could not be found.</p>
        <div class="actions">
          <a class="button solid" href="/">Home</a>
          <a class="button" href="/#contact">Contact</a>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var pathname = window.location.pathname;
        var isDirect404 = pathname.endsWith('/404.html');

        if (isDirect404) {
          return;
        }

        var target = pathname + window.location.search + window.location.hash;
        window.location.replace('/?p=' + encodeURIComponent(target));
      })();
    </script>
  </body>
</html>
